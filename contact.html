<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | TI-TI Corporation</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap"
    rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>

<body>
  <header class="site-header">
    <div class="container d-flex align-items-center justify-content-between py-2 gap-2">
      <a href="index.html" class="brand d-flex align-items-center gap-2"><img src="images/logo.png"
          alt="TI-TI Corporation logo" class="brand-logo" width="44" height="44"><span class="brand-text">TI-TI <span
            class="corp">Corporation</span></span></a>
      <nav class="d-flex align-items-center gap-2">
        <a href="contact.html" class="btn btn-brand btn-sm" data-i18n="navContact">Contact us</a>
        <button id="langBtn" class="btn btn-outline-light btn-sm" type="button">اردو</button>
      </nav>
    </div>
  </header>
  <main class="container py-4">
    <h1 class="h2" data-i18n="contactTitle">Contact us</h1>
    <p data-i18n="contactIntro"></p>
    <div class="row g-4">
      <div class="col-md-6">
        <p class="mb-1 fw-semibold" data-i18n="addressLabel">Address</p>
        <p class="mb-2" data-i18n="address"></p>
        <a class="btn btn-wa mb-3" target="_blank" rel="noopener" data-i18n="openMap"
          href="https://www.google.com/maps/search/?api=1&query=6-Muslim+Street+Nicholson+Road+Qila+Gujjar+Singh+Lahore"></a>
        <p class="mb-1 fw-semibold">Email</p>
        <p><a href="mailto:tahakhalid1875@gmail.com">tahakhalid1875@gmail.com</a></p>
      </div>
      <div class="col-md-6">
        <div id="people" class="d-grid gap-3"></div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="products.js"></script>
  <script src="common.js"></script>
  <script>
    function render() { applyStatic(); $("#people").innerHTML = CONTACTS.map(c => personRow(c)).join(""); }
    initLang(render);
  </script>
</body>

</html>
