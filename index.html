<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TI-TI Corporation | Petrol Pump Spare Parts, Lahore</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap"
    rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>

<body>
  <header class="site-header">
    <div class="container d-flex align-items-center justify-content-between py-2 gap-2">
      <a href="index.html" class="brand d-flex align-items-center gap-2"><img src="images/logo.png"
          alt="TI-TI Corporation logo" class="brand-logo" width="44" height="44"><span class="brand-text">TI-TI <span
            class="corp">Corporation</span></span></a>
      <nav class="d-flex align-items-center gap-2">
        <a href="contact.html" class="btn btn-brand btn-sm" data-i18n="navContact">Contact us</a>
        <button id="langBtn" class="btn btn-outline-light btn-sm" type="button">اردو</button>
      </nav>
    </div>
  </header>
  <main>
    <section class="hero">
      <div class="container">
        <div class="row align-items-center g-4">
          <div class="col-lg-7">
            <h1 data-i18n="heroTitle">Parts for the pump, the pipe and the tank.</h1>
            <p class="lead" data-i18n="heroText"></p>
            <a href="#products" class="btn btn-brand btn-lg" data-i18n="viewItems">View items</a>
          </div>
          <div class="col-lg-5">
            <div class="hero-media">
              <div class="hero-panel">
                <div class="hero-panel-heading">
                  <img src="images/logo.png" alt="" width="48" height="48">
                  <p class="mb-0 fw-semibold" data-i18n="dealsIn">Deals in</p>
                </div>
                <ul id="heroList"></ul>
              </div>
              <img class="hero-photo" src="images/Logo.jpeg" alt="Fuel pumps displayed at a service station">
            </div>
          </div>
        </div>
      </div>
    </section>
    <section id="products" class="container pb-5">
      <h2 class="pt-4" data-i18n="productsTitle">Our items</h2>
      <div class="filters">
        <input id="search" class="form-control mb-2" type="search" data-i18n-ph="searchPh" placeholder="Search items">
        <div id="chips" class="chips"></div>
      </div>
      <div id="grid" class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-2 g-md-3 mt-1"></div>
      <p id="empty" class="text-muted d-none" data-i18n="empty"></p>
    </section>

  </main>
  <footer id="contact" class="contact py-5">
    <div class="container">
      <h2 data-i18n="contactTitle">Contact us</h2>
      <div id="people" class="row row-cols-1 row-cols-md-2 g-3 mt-1"></div>
      <div class="row g-4 mt-3">
        <div class="col-md-6">
          <p class="mb-1 fw-semibold" data-i18n="addressLabel">Address</p>
          <p data-i18n="address">6-Muslim Street, Nicholson Road, Qila Gujjar Singh, Lahore-54000</p>
        </div>
        <div class="col-md-6">
          <p class="mb-1 fw-semibold">Email</p>
          <p><a href="mailto:tahakhalid1875@gmail.com">tahakhalid1875@gmail.com</a></p>
        </div>
      </div>
    </div>
    <div class="py-3 text-center small text-muted">© TI-TI Corporation, Lahore</div>
  </footer>

  <script src="products.js"></script>
  <script src="common.js"></script>
  <script src="home.js"></script>
</body>

</html>
